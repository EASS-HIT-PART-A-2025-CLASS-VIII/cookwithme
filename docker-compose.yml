services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SEED_DATA=true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: pytest -q
    environment:
      DATABASE_URL: sqlite://
      SEED_DATA: "false"
    volumes:
      - .:/app